# Registry of every CAP-Prune experiment whose outputs live under the runs root (default ~/cap-prune-runs).
# `capprune results-index` reads it and writes <root>/RESULTS_INDEX.md + results_index.json: configs (with SHA-256),
# code hashes (and which source files changed since each run was registered), the git commit, report paths and
# headline numbers extracted from each experiment's own JSON outputs.  Paths are relative to the runs root.
experiments:
  - id: exp1-adaptive-pilot
    title: "Experiment 1: adaptive candidate evaluation (offline replay, 3 allocation policies)"
    folder: adaptive/pilot
    configs: [configs/adaptive_pilot.yaml]
    reports: [adaptive/pilot/replay/summary.md]
    docs: docs/adaptive_evaluation.md
    extractor: adaptive_replay
    label: pilot
  - id: gate-design
    title: "Capability-gate design on development data (MMLU validation) - locked the live gate"
    folder: adaptive/gate-dev
    configs: [configs/gate_dev.yaml]
    reports: [adaptive/gate-dev/design/summary.md]
    docs: docs/live_gate.md
    extractor: gate_design
    label: development (locks settings)
  - id: live-gate-gemini
    title: "Experiment 2: capability gate in the live loop, Gemini controller (arms A-D)"
    folder: live-gate
    configs: [configs/live_gate.yaml]
    reports: [live-gate/_live/report.md]
    docs: docs/live_gate.md
    extractor: search_runs
    label: "pilot, one seed (arm B paused at 7/10 by API quota; arm D not started)"
  - id: live-gate-ollama
    title: "Experiment 2 with a local controller (Ollama Qwen2.5-7B)"
    folder: live-gate-ollama
    configs: [configs/live_gate_local.yaml]
    reports: [live-gate-ollama/_live/report.md]
    docs: docs/live_gate.md
    extractor: search_runs
    label: exploratory, one seed
  - id: gap-diagnostic
    title: "2x2 gap diagnostic of the greedy checkpoint (pool vs held-out x 0- vs 5-shot)"
    folder: live-gate-diagnostics/greedy_cap_gap
    configs: [configs/live_gate.yaml]
    reports: [live-gate-diagnostics/greedy_cap_gap/summary.md]
    docs: docs/live_gate.md
    extractor: gap
    label: diagnostic (held-out split inspected)
  - id: fixed-state
    title: "Fixed-state controller comparison (Qwen2.5-14B vs 7B, free-form vs shortlist)"
    folder: fixed-state/compare
    configs: [configs/fixed_state.yaml]
    reports: [fixed-state/compare/report.md]
    docs: docs/fixed_state.md
    extractor: fixed_state
    label: pilot
  - id: ranker
    title: "Learned action ranking (offline, leave-one-trajectory-out)"
    folder: ranker/data
    configs: [configs/ranker.yaml]
    reports: [ranker/data/report.md]
    docs: docs/ranker.md
    extractor: ranker
    label: offline comparison
  - id: gradient-live
    title: "Gradient-only top-1 live pilot (10 proposals / 30k questions)"
    folder: gradient-live
    configs: [configs/gradient_live.yaml]
    reports: [gradient-live/_analysis/report.md, gradient-live/_analysis/audit_materialized/audit_materialized.md]
    docs: docs/gradient_live.md
    extractor: ranked_run
    label: "fresh MMLU-CF audit (first use of MMLU-CF)"
    notes: "Ran on uncommitted code. Reproduced exactly with later code: gradient-live-ext replayed attempts 1-10 (shortlists, actions, gate decisions, question counts, per-category counts, final mask) under verify_prefix."
  - id: gradient-live-ext
    title: "Extended gradient-only search (arm A: top-1, 30 proposals / 100k questions)"
    folder: gradient-live-ext
    configs: [configs/gradient_live_ext.yaml]
    reports: [gradient-live-ext/_analysis/report.md, gradient-live-ext/_analysis/audit_materialized/audit_materialized.md]
    docs: docs/gradient_live.md
    extractor: ranked_run
    label: exploratory audit (sets inspected before)
    notes: "gradient_live.py / gradient_audit.py changed after registration (top-2 fallback, gate margin, logging, reports). Reproduced exactly with the later code: gradient-top2 (arm B) replayed attempts 1-16 under verify_prefix, final mask included."
  - id: gradient-boundary
    title: "Compression boundary of the top-1 trajectory + gate-margin calibration"
    folder: gradient-boundary
    configs: [configs/gradient_boundary.yaml]
    reports: [gradient-boundary/report.md]
    docs: docs/gradient_live.md
    extractor: boundary
    label: exploratory (calibration inconclusive)
  - id: gradient-top2
    title: "Arm B: gradient top-2 fallback, current gate"
    folder: gradient-top2
    configs: [configs/gradient_top2.yaml]
    reports: [gradient-top2/_analysis/audit_materialized/audit_materialized.md]
    docs: docs/gradient_live.md
    extractor: ranked_run
    label: exploratory audit
  - id: gradient-top2-strict
    title: "Arm C: gradient top-2 fallback, stricter gate (margin 2.0 pts, exploratory)"
    folder: gradient-top2-strict
    configs: [configs/gradient_top2_strict.yaml]
    reports: [gradient-top2-strict/_analysis/audit_materialized/audit_materialized.md]
    docs: docs/gradient_live.md
    extractor: ranked_run
    label: exploratory audit, exploratory margin
  - id: gradient-compare
    title: "A vs B vs C live-policy comparison"
    folder: gradient-compare
    configs: [configs/gradient_compare.yaml]
    reports: [gradient-compare/report.md]
    docs: docs/gradient_live.md
    extractor: compare
    label: exploratory
  - id: population-regate
    title: "Retrospective population-level re-gating of runs A/B/C (pre-registered rule v1, CPU)"
    folder: population-regate
    configs: [configs/population_regate.yaml, docs/population_gate_rule.md]
    reports: [population-regate/report.md, population-regate/phase1_summary.md]
    docs: docs/population_gate.md
    extractor: population_regate
    label: retrospective (pre-registered rule); audit comparisons exploratory
  - id: pool-signals
    title: "Continuous paired signals on the gate pool vs. exploratory audit losses (7 checkpoints)"
    folder: pool-signals
    configs: [configs/pool_signals.yaml, docs/pool_signals_plan.md]
    reports: [pool-signals/report.md, pool-signals/phase2_summary.md]
    docs: docs/population_gate.md
    extractor: pool_signals
    label: exploratory, descriptive (n = 7)
  - id: screen-confirm
    title: "Screen-then-confirm protocol (v1 + amendment 1: IUT, fixed sequence): confirmation sample sizes (no confirmation run yet)"
    folder: screen-confirm
    configs: [configs/screen_confirm.yaml, configs/screen_confirm_v2.yaml, docs/screen_confirm_protocol.md]
    reports: [screen-confirm/confirmation_sizes.md, screen-confirm/confirmation_sizes_v2.md]
    docs: docs/screen_confirm_protocol.md
    extractor: screen_confirm
    label: protocol (committed before any new scoring); sample-size planning only
  - id: matched-signals
    title: "Matched-compression signal test: KL vs. net flip as choice signals among equal-size actions (3 stall parents x 11)"
    folder: matched-signals
    configs: [configs/matched_signals.yaml, docs/matched_signal_plan.md]
    reports: [matched-signals/report.md]
    docs: docs/matched_signals.md
    extractor: matched_signals
    label: exploratory (pre-registered plan and split; gate-pool items only, no audit sets)
  - id: matched-signals-ordinary
    title: "Matched-signal test on ordinary parents (ranker trajectories, 13 x 11) vs. the stall parents; policy recommendation"
    folder: matched-signals-ordinary
    configs: [configs/matched_signals_ordinary.yaml, docs/matched_signal_plan_ordinary.md]
    reports: [matched-signals-ordinary/comparison.md, matched-signals-ordinary/report.md, matched-signals-ordinary/after_rejection.md,
              matched-signals-ordinary/tv_posthoc.md]
    docs: docs/matched_signals_ordinary.md
    extractor: matched_signals_ordinary
    label: exploratory (pre-registered parent list, plan and split; parents as units; after-rejection and TV tables post hoc)
  - id: confirmatory-smollm3-3b
    title: "Confirmatory study, model 1 SmolLM3-3B-Base (pilot = seed 0, main = seeds 1-2; arms a/b/c, every frozen checkpoint scored)"
    folder: confirmatory/smollm3-3b
    configs: [configs/confirmatory.yaml, configs/confirmatory_smollm3.yaml, docs/confirmatory_study_plan.md]
    reports: [confirmatory/smollm3-3b/registration.md, confirmatory/smollm3-3b/batches/pilot/report.md,
              confirmatory/smollm3-3b/batches/main/report.md]
    docs: docs/confirmatory_report.md
    extractor: confirmatory
    label: confirmatory (plan v1 f0152c8, amendments 1-3); S1-S4 added after the pilot (post hoc for the pilot)
  - id: confirmatory-granite-3.3-2b
    title: "Confirmatory study, model 2 Granite-3.3-2B-Base (main = seeds 0-2; arms a/b/c, every frozen checkpoint scored)"
    folder: confirmatory/granite-3.3-2b
    configs: [configs/confirmatory.yaml, configs/confirmatory_granite.yaml, docs/confirmatory_study_plan.md]
    reports: [confirmatory/granite-3.3-2b/registration.md, confirmatory/granite-3.3-2b/batches/main/report.md]
    docs: docs/confirmatory_report.md
    extractor: confirmatory
    label: confirmatory (plan v1 f0152c8, amendments 1-3); S1-S4 added after the pilot
  - id: confirmatory-study
    title: "Confirmatory study summary over both models: primary endpoint paired across seeds, C1, C4, C6, S1-S4, cost"
    folder: confirmatory/study
    configs: [configs/confirmatory.yaml, docs/confirmatory_study_plan.md]
    reports: [confirmatory/study/study.md]
    docs: docs/confirmatory_report.md
    extractor: confirmatory_study
    label: confirmatory (primary, C1, C4, C6); S1-S4 secondary, added after the pilot
    notes: "derived summary with no registration of its own: written by `capprune confirmatory study` at commit 21ab08d (clean tree; study.json records it) from the two registered model folders above"
  - id: exploratory-confirmatory-outcomes
    title: "EXPLORATORY analyses of the scored confirmation outcomes: certification frontier (2-5 points x 500-full items), loss curves, C1 mechanism"
    folder: exploratory
    configs: [configs/confirmatory.yaml]
    reports: [exploratory/exploratory.md]
    docs: docs/exploratory_report.md
    extractor: exploratory
    label: exploratory (post hoc on the confirmatory outcomes; not part of the confirmatory claims)
    notes: "derived from the confirmatory batches' outcomes.npz (SHA-256 checked); the 3-point column reproduces every recorded claim, S3 and S4"
  - id: bound-development
    title: "Bound development for paper B: candidate per-category bounds, simulated validity and sample sizes, applied to the scored outcomes; go/no-go"
    folder: bound-dev
    configs: [configs/confirmatory.yaml, docs/bound_development_plan.md]
    reports: [bound-dev/simulation.md, bound-dev/real_data.md]
    docs: docs/bound_development_plan.md
    extractor: bound_dev
    label: method development on seen data (plan 231c2a6 committed before any candidate touched real data); selects a method, not a claim
  - id: compensation-feasibility
    title: "EXPLORATORY: does a ridge least-squares refit of each pruned layer's output weights reduce the accuracy lost per step? Same masks, with and without (Qwen3-1.7B)"
    folder: compensation-feasibility
    configs: [configs/compensation_feasibility.yaml, docs/compensation_feasibility_plan.md]
    reports: [compensation-feasibility/analysis/analysis.md]
    docs: docs/compensation_feasibility_report.md
    extractor: compensation
    label: exploratory (development model, seen items; plan e9a61d2 committed before any model was scored)
  - id: unstructured-feasibility
    title: "EXPLORATORY: does uniform one-shot unstructured Wanda keep every category within 2 points to a much higher compression than channel removal? (Qwen3-1.7B, Qwen3-8B)"
    folder: unstructured-feasibility
    configs: [configs/unstructured_feasibility.yaml, configs/confirmatory_qwen3_8b.yaml, docs/unstructured_feasibility_plan.md]
    reports: [unstructured-feasibility/analysis/analysis.md, confirmatory/qwen3-8b/registration.md]
    docs: docs/unstructured_feasibility_report.md
    extractor: unstructured
    label: exploratory (Qwen3-1.7B seen items; Qwen3-8B screening pool, sealed first; plan 805b7a5 committed before any model was scored)
  - id: kl-probe-smoke-qwen
    title: "GPU smoke test of the amendment-2 proposer (KL probe after a rank-1 rejection, counterfactual log) on Qwen3-1.7B"
    folder: _smoke/kl-probe-qwen
    configs: [configs/kl_probe_smoke_qwen.yaml]
    reports: []
    docs: docs/screen_confirm_protocol.md
    extractor: kl_probe_smoke
    label: smoke test (NOT a result; rank-1 reject forced by the test hook)
  - id: unstructured
    title: "Unstructured-mode CAP-Prune matrix (started, never progressed past setup)"
    folder: unstructured
    configs: [configs/base.yaml]
    reports: []
    docs: README.md
    extractor: search_runs
    label: incomplete
