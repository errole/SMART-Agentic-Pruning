        Other: 9a5614da0ae1100cf9fe2985aa4ddb745b29cfc84824eddf21ddf24c0be6a013
        Philosophy: 43fcbfa03ed9b315f98eda44bf23fad79b16c4ff8bfca3c74cd0987368e85d67
        Physics: cff3650ea352476ba41733a7a4f0b99dc7ce07be95641f3fa4dca90d52705c5d
