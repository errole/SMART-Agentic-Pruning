# Compensation feasibility: EXPLORATORY, on the development model Qwen3-1.7B (docs/compensation_feasibility_plan.md).
# Does refitting each pruned layer's output weights (ridge least squares to the dense layer output) reduce the accuracy
# lost per pruning step? The same masks, with and without compensation.
#
#   python -m capprune supervise    --config configs/compensation_feasibility.yaml                 # reference trajectory (60 proposals)
#   python -m capprune compensation reference  --config configs/compensation_feasibility.yaml      # freeze its masks; check vs gradient-live-ext
#   python -m capprune compensation build-eval --config configs/compensation_feasibility.yaml      # 3,000 items per category
#   python -m capprune compensation score      --config configs/compensation_feasibility.yaml --operator mask
#   python -m capprune compensation compensate --config configs/compensation_feasibility.yaml      # refit along the masks (resumable)
#   python -m capprune compensation score      --config configs/compensation_feasibility.yaml --operator comp
#   python -m capprune compensation analyze    --config configs/compensation_feasibility.yaml
#
# Inherited from gradient_live.yaml (-> ranker.yaml -> ... -> qwen3_1.7b_structured.yaml): the model, the structured
# MLP-channel operator, the candidate generator and step (4 units x 5 blocks x 64 channels), the profiling protocol.
extends: gradient_live.yaml

experiment:
  runs_dir: ~/cap-prune-runs/compensation-feasibility/reference

reliability:
  keep_all_masks: true         # every accepted mask is kept (the compensated trajectory replays them)

ranked_search:
  max_proposals: 60            # the most the extension rule can ask for (plan section 3); the trajectory is 40 steps
  question_cap: 100000         # unused: the perplexity screen reveals no questions

methods:
  mask_only_top1:              # gradient top-1, NO GATE: a perplexity screen with tau = 1e9 accepts every proposal
    kind: ranked_search        #   and only records C4 validation perplexity at each step
    overrides: {gate: {kind: capability, capability: {policy: threshold_aware}}, ranked_search: {screen: perplexity, ppl_tau: 1000000000.0}}

matrix:
  methods: [mask_only_top1]
  targets: [0.0]
  seeds: [0]

compensation:
  out_dir: ~/cap-prune-runs/compensation-feasibility
  method: mask_only_top1
  seed: 0
  trajectory_steps: 40         # L; the extension rule may raise it to at most 60 (plan section 5)
  max_steps: 60
  reach_limit: 0.02            # 2.0 points, worst category, point estimate
  ridge_fraction: 0.01         # lambda = 0.01 x mean(diag(C[K, K]))
  calibration: {seed: 1, windows: 128}   # from the prepared 256-window C4-train pool; profiling uses seed 0
  check_against: ~/cap-prune-runs/gradient-live-ext/gradient_top1__t00__s0/journal.jsonl
  eval: {per_category: 3000, seed: 20261126, batch: 100, order_seed: 2026}
  confirmation_rule: {alpha: 0.05, tolerance: 0.03}   # "on seen items, not a certificate"
  sources:
    mmlu_prepared_dir: ~/cap-prune-runs/data       # identical to cais/mmlu @ c30699e8 (test, validation, dev; checked)
    mmlu_dataset: {repo: cais/mmlu, revision: c30699e8356da336a370243923dbaf21066bb9fe}
    mmlu_file_sha256:
      mmlu_probe.jsonl: 4fbb96420259fb41936336a636712d7c9668b138406c7eb90998ff64d46e1e6a
