# Hardware-supported structured pruning: MLP intermediate channels are removed
# (gate/up/down jointly, multiples of 64) so the model physically shrinks and
# runs faster on any GPU. Eligible weights = MLP weights (75 % of decoder linears).
extends: base.yaml

experiment:
  runs_dir: ~/cap-prune-runs/structured
pruning:
  mode: structured
reliability:
  keep_all_masks: true      # keep the mask of EVERY accepted state (~25 KB each in structured mode); not part of the science hash
