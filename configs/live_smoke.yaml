# CPU smoke test of the live gate experiment (tiny random Qwen3, synthetic data, scripted mock controller).
#
#   python -m capprune make-tiny --out .smoke/tiny-qwen3
#   python -m capprune prepare --config configs/smoke.yaml
#   python tests/live_smoke.py                                         # -> .smoke/data-live (see that file)
#   Start-Process python "tests/mock_controller.py --port 8765 --script live"
#   python -m capprune supervise   --config configs/live_smoke.yaml
#   python -m capprune live-bench  --config configs/live_smoke.yaml
#   python -m capprune live-report --config configs/live_smoke.yaml
#
# Do NOT run `capprune prepare` with this config: data_dir holds the relabelled copy made by tests/live_smoke.py.
extends: live_gate.yaml

experiment:
  name: live-smoke
  runs_dir: ../.smoke/live-runs
  data_dir: ../.smoke/data-live

model:
  name_or_path: ../.smoke/tiny-qwen3
  dtype: float32
  device: cpu
  max_seq_len: 256

pruning:
  structured: {channel_multiple: 16, max_unit_sparsity: 0.875}

data:
  source: synthetic
  calibration: {pool_size: 16, num_samples: 8, seq_len: 64}
  ppl_gate: {num_samples: 4, seq_len: 64}
  wikitext: {seq_len: 64, synthetic_tokens: 3000}
  synthetic_questions_per_subject: 200   # probe pools: STEM 320, Humanities 160, Social Sciences 80, Other 80

profiling: {activation_samples: 4, gradient_samples: 2, gradient_every: 3, activation_batch_size: 4}

search:
  max_iterations: 4
  max_increment: 0.9          # lets the scripted "heavy" proposal break the tiny model in one step

controller:
  model: mock-controller
  retries: 2
  backoff_s: [0.1]
  timeout_s: 10
  endpoints:
    - {name: mock, api: openai, base_url: "http://127.0.0.1:8765/v1"}

gate:
  capability:
    tolerance: 0.15
    min_sample: 16
    batch_size: 16
    budget: 360               # < pool (640): a near-limit candidate runs out of questions
    total_budget: null

final_eval: {mmlu_shots: 1, max_seq_len: 256, fqa_max_new_tokens: 4, chunk_size: 48}

live_bench: {prompt_len: 32, gen_tokens: 4, warmup: 1, repeats: 6}

reliability:
  min_free_gb: 0.1
  hang_timeout_s: 120
  max_restarts: 3
  restart_backoff_s: [1]
  controller_wait_s: 1
  stop_grace_s: 20

matrix:
  targets: [0.5]
  seeds: [0]
